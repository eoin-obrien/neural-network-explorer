$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: '0.2'
language: en-GB,en

# Learner-facing prose and source strings. CLAUDE.md and IMPLEMENTATION.md are
# LaTeX-dense specification documents and are checked by review, not by cspell.
files:
  - 'src/**'
  - 'e2e/**'
  - 'index.html'
  - 'README.md'
  - 'CONTRIBUTING.md'
  - '.github/**/*.md'

ignorePaths:
  - node_modules/**
  - dist/**
  - coverage/**
  - playwright-report/**
  - test-results/**
  - reports/**
  - .stryker-tmp/**
  - pnpm-lock.yaml

dictionaryDefinitions:
  - name: project
    path: ./project-words.txt
    addWords: true

dictionaries:
  - project
